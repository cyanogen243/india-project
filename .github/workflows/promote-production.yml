name: promote-production

# Manual, on-demand production deploys. Promotes an image that CI already
# built and staging already ran — never builds anything new.
on:
  workflow_dispatch:
    inputs:
      shortsha:
        description: "7-char app commit sha to promote (blank = HEAD of the branch you run this from)"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - id: vars
        run: |
          SHA='${{ github.event.inputs.shortsha }}'
          echo "shortsha=${SHA:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to promote an image that does not exist
        run: docker manifest inspect ghcr.io/${{ github.repository }}:prod-${{ steps.vars.outputs.shortsha }} > /dev/null
      - uses: actions/checkout@v4
        with:
          repository: cyanogen243/india-project-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: Bump production image tag (Flux rolls it out)
        run: |
          sed -i "s|tag: .*|tag: prod-${{ steps.vars.outputs.shortsha }}|" \
            clusters/india-project-prod/apps/india-project/helmrelease.yaml
          git config user.name cyanogen243
          git config user.email 309939834+cyanogen243@users.noreply.github.com
          git commit -am "deploy(prod): ${{ steps.vars.outputs.shortsha }}" || exit 0
          git push
