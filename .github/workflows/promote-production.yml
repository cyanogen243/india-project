name: promote-production

# The ONLY path to production. Manual, on-demand: promotes an image tag that
# CI already built (a release like v1.2.0, or a prod-<sha> for emergencies) —
# never builds anything new.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to promote — a release version (v1.2.0) or prod-<sha>"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to promote an image that does not exist
        run: docker manifest inspect "ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}" > /dev/null
      - uses: actions/checkout@v4
        with:
          repository: cyanogen243/india-project-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: Bump production image tag (Flux rolls it out)
        run: |
          sed -i "s|tag: .*|tag: ${{ github.event.inputs.tag }}|" \
            clusters/india-project-prod/apps/india-project/helmrelease.yaml
          git config user.name cyanogen243
          git config user.email 309939834+cyanogen243@users.noreply.github.com
          git commit -am "deploy(prod): ${{ github.event.inputs.tag }}" || exit 0
          git push
