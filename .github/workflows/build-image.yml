name: build-and-deploy-staging

on:
  push:
    branches: [main, feat/self-hosting]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.vars.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NEXT_PUBLIC_* values are baked at build time, so each environment gets
      # its own image variant. Both are built on every push; promotion to
      # production later needs no build, just a tag bump (promote-production).
      - name: Build staging-baked image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:staging-${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build production-baked image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.theindiaproject.net
          tags: |
            ghcr.io/${{ github.repository }}:prod-${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cyanogen243/india-project-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: Bump staging image tag (Flux rolls it out)
        run: |
          sed -i "s|tag: .*|tag: staging-${{ needs.build.outputs.shortsha }}|" \
            clusters/india-project-staging/apps/india-project/helmrelease.yaml
          git config user.name cyanogen243
          git config user.email 309939834+cyanogen243@users.noreply.github.com
          git commit -am "deploy(staging): ${{ needs.build.outputs.shortsha }}" || exit 0
          git push
