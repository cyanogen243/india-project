name: build-image

# Artifact production only — this repo knows nothing about deployment.
#   every push: build container image variants, push to GHCR (sha-tagged)
#   main only: semantic-release mints vX.Y.Z and aliases the same images
# Where and when these images RUN is decided elsewhere (private infra repo).

on:
  push:
    branches: [main, feat/self-hosting]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.vars.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NEXT_PUBLIC_* values are baked at build time, so each environment gets
      # its own image variant. Releases alias these — nothing builds twice.
      - name: Build staging-baked image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          tags: |
            ghcr.io/${{ github.repository }}:staging-${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build production-baked image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.theindiaproject.net
          tags: |
            ghcr.io/${{ github.repository }}:prod-${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: semantic-release (tag + GitHub Release from conventional commits)
        run: npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect whether a release was cut
        id: ver
        run: |
          git fetch --tags -q
          echo "version=$(git tag --points-at HEAD | grep '^v' | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.ver.outputs.version != ''
        name: Alias the release version to the already-built images (no rebuild)
        run: |
          V='${{ steps.ver.outputs.version }}'
          S='${{ needs.build.outputs.shortsha }}'
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:$V" "ghcr.io/${{ github.repository }}:prod-$S"
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:$V-staging" "ghcr.io/${{ github.repository }}:staging-$S"
