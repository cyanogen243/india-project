name: build-image

# Build and publish versioned container images.
#   each push to main: one sha-tagged image pushed to GHCR
#   then: semantic-release mints vX.Y.Z and tags that same image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Releases are minted from an ordered history; runs for successive pushes
# queue rather than race the tag.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate as ci.yml: nothing is published from a commit that fails it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_COMMITTED_FEED_ONLY: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec tsc -- --noEmit
      - run: npm run lint

  build:
    # Also on workflow_dispatch, which can be aimed at any branch: nothing is
    # published from a commit that is not on main.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.vars.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.shortsha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tests above run on the runner, never in the image. Starting it is
      # the check: the server verifies its own native dependencies before it
      # serves anything, so an image missing them never answers this request.
      - name: Start the pushed image and serve one request
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.shortsha }}"
          docker run --rm --user node "$IMAGE" touch .next/cache/probe
          docker run -d --name smoke -p 3000:3000 \
            -e LIBSQL_URL=file:/tmp/smoke.db \
            -e SESSION_SECRET=smoke-session-secret-not-for-production \
            -e RATE_LIMIT_SECRET=smoke-rate-limit-secret-not-for-production \
            -e SITE_URL=https://smoke.invalid "$IMAGE"
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break || sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3000/ || { docker logs smoke; exit 1; }
          docker rm -f smoke

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # From the lockfile, not resolved at run time: this job holds a token
      # that can write releases and packages, so every transitive dependency
      # it executes is one the repository has committed to.
      - run: npm ci
      - name: semantic-release (tag + GitHub Release from conventional commits)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read from the tag semantic-release just put on this commit, not from
      # whichever release GitHub considers latest: releases minted before this
      # workflow existed have no image to point at, and a run that mints
      # nothing must not try to tag one. Re-running the job repeats the alias
      # harmlessly.
      - name: Give the built image its version tag (no rebuild)
        run: |
          set -euo pipefail
          V=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
          if [ -z "$V" ]; then echo "this run minted no release"; exit 0; fi
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create -t "$IMAGE:$V" "$IMAGE:${GITHUB_SHA::7}"
          echo "tagged $IMAGE:$V"
