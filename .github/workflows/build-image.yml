name: build-image

# Build and publish versioned container images.
#   every push: one sha-tagged image pushed to GHCR
#   main only: semantic-release mints vX.Y.Z and tags that same image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.vars.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: semantic-release (tag + GitHub Release from conventional commits)
        run: npx --yes -p conventional-changelog-conventionalcommits -p semantic-release@24 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Idempotent: give the latest release its version tag, whether or not
      # this run is the one that minted it.
      - name: Ensure the latest release has its image tag (no rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          V=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          [ -n "$V" ] || { echo "no releases yet"; exit 0; }
          if docker manifest inspect "$IMAGE:$V" > /dev/null 2>&1; then
            echo "$V already tagged"; exit 0
          fi
          git fetch --tags -q
          # ^{commit} so an annotated tag resolves to the commit the build job
          # tagged its image with, cut to the same seven characters it used.
          S=$(git rev-parse "$V^{commit}" | cut -c1-7)
          docker buildx imagetools create -t "$IMAGE:$V" "$IMAGE:$S"
